<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="style.css"><title>Loja</title></head>
<body>
<nav class="navbar">
 <div class="navbar-brand">demylly</div>
 <div class="navbar-links">
  <button class="nav-btn active" data-secao="produtos">Produtos</button>
  <button class="nav-btn" data-secao="carrinho">Carrinho <span id="carrinhoContador" class="badge">0</span></button>
  <button class="nav-btn" data-secao="login" id="btnLoginNav">Login</button>
  <button class="nav-btn" data-secao="cadastro">Cadastro</button>
 </div>
 <div class="navbar-user" id="navbarUser" style="display:none;"><span id="usuarioNome"></span><button id="btnLogout" class="nav-btn logout">Sair</button></div>
</nav>
<main>
<section id="secao-produtos" class="secao"><h1>Produtos</h1><div id="produtosErro" class="error-message"></div><div id="listaProdutos" class="grid-produtos"></div></section>
<section id="secao-carrinho" class="secao" hidden><h1>Carrinho</h1><div id="carrinhoVazio" class="aviso" hidden>Seu carrinho está vazio.</div><div class="ticket"><div id="listaCarrinho"></div><div id="carrinhoTotal" class="carrinho-total"></div><button id="btnFinalizar" class="submit-btn" hidden>Finalizar compra</button></div></section>
<section id="secao-login" class="secao" hidden><h1>Login</h1><form id="formLogin"><div class="campo"><label for="loginEmail">E-mail</label><input type="email" id="loginEmail" required></div><div class="campo"><label for="loginSenha">Senha</label><input type="password" id="loginSenha" required></div><span id="loginErro" class="error-message"></span><button type="submit" class="submit-btn">Entrar</button></form><p class="link-secundario">Sem conta? <a href="#" data-secao="cadastro">Cadastre-se</a></p></section>
<section id="secao-cadastro" class="secao" hidden><h1>Cadastro</h1><form id="formCadastro"><div class="campo"><label for="nome">Nome</label><input type="text" id="nome" required></div><div class="campo"><label for="cpf">CPF</label><input type="text" id="cpf" placeholder="000.000.000-00" required></div><div class="campo"><label for="email">E-mail</label><input type="email" id="email" required></div><div class="campo"><label for="celular">Celular</label><input type="tel" id="celular" placeholder="(99) 99999-9999" required></div><div class="campo"><label for="senha">Senha</label><input type="password" id="senha" minlength="6" required></div><div class="campo"><label for="dataNascimento">Data de nascimento</label><input type="date" id="dataNascimento" required></div><div class="campo"><label for="cep">CEP</label><input type="text" id="cep" placeholder="00000-000" inputmode="numeric" maxlength="9" autocomplete="postal-code" required><small id="cepStatus" class="cep-status"></small></div><div class="campo"><label for="rua">Rua</label><input type="text" id="rua" required></div><div class="campo"><label for="numero">Número da casa</label><input type="text" id="numero" maxlength="10" required></div><div class="campo"><label for="bairro">Bairro</label><input type="text" id="bairro" required></div><div class="campo"><label for="cidade">Cidade</label><input type="text" id="cidade" required></div><div class="campo"><label for="estado">Estado</label><select id="estado" required><option value="">Selecione</option><option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option><option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option><option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option><option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option><option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option><option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option><option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option><option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option><option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option></select></div><span id="cadastroErro" class="error-message"></span><button type="submit" class="submit-btn">Enviar cadastro</button></form></section>
</main>
<script src="script.js"></script>
</body></html>
